<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Contact — Nicoleta Secu">Contatti — Nicoleta Secu</title>
  <script>
    (function () { var t, l, d = document.documentElement; try { t = localStorage.getItem("theme"); l = localStorage.getItem("lang"); } catch (e) {} d.dataset.theme = t || "dark"; d.lang = l === "en" ? "en" : "it"; })();
  </script>
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png?v=4" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/wow.css?v=31">
</head>
<body data-page="contact">
  <div class="fx" aria-hidden="true"><div class="fx-aurora"></div><div class="fx-vignette"></div><div class="fx-grain"></div></div>
  <div class="cursor" aria-hidden="true"><span class="cursor-dot"></span><span class="cursor-ring"></span><b class="cursor-label"></b></div>

  <header class="nav" aria-label="Navigazione" data-en-aria-label="Navigation">
    <a href="index.html#home" class="nav-brand">Nicoleta Secu</a>
    <nav class="nav-pill">
      <a href="index.html#home" class="nav-link" data-section="home">Home</a>
      <a href="progetti.html" class="nav-link" data-page="projects" data-en="Projects">Progetti</a>
      <a href="chi-sono.html" class="nav-link" data-page="about" data-en="About">Chi sono</a>
      <a href="contatti.html" class="nav-link" data-page="contact" aria-current="page" data-en="Contact">Contatti</a>
    </nav>
    <div class="nav-right">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Tema chiaro o scuro" data-en-aria-label="Light or dark theme"><span></span></button>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div class="mono"><span class="num">—</span> <span data-en="Contact">Contatti</span></div>
      <h1 class="page-big" data-en="Let's talk.">Scriviamoci.</h1>
      <p class="page-lead" data-en="For a project, a collaboration or just to say hi: I'll get back to you as soon as I can.">Per un progetto, una collaborazione o anche solo per un saluto: ti rispondo appena posso.</p>
    </section>

    <section class="block">
      <form class="mail" id="contactForm" novalidate>
        <label><span class="mono">email</span><input type="email" name="email" autocomplete="email" required maxlength="200"></label>
        <label><span class="mono" data-en="subject">oggetto</span><input type="text" name="subject" required maxlength="150"></label>
        <label class="mail-full"><span class="mono" data-en="message">messaggio</span><textarea name="message" rows="6" required maxlength="4000"></textarea></label>
        <input class="botcheck" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="mail-foot">
          <button type="submit" class="btn" data-en="Send →">Invia →</button>
          <p class="contact-status mono" id="contactStatus" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <footer class="foot mono">
    <span>Nicoleta Secu · © 2026</span>
    <a href="https://github.com/NicoletaSecu" target="_blank" rel="noopener">GitHub ↗</a>
  </footer>

  <script src="js/site.js?v=18"></script>
</body>
</html>
