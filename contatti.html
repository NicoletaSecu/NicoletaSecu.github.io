      document.documentElement.dataset.theme = t;

<!-- data-title: la chiave del titolo della scheda in content/texts.js -->
<body data-title="page.contactTitle">
  <!-- I testi stanno in content/texts.js: qui sotto ci sono solo quelli italiani di partenza -->
  <header class="fl-top">
    <a href="index.html" class="fl-brand">Nicoleta Secu</a>
    <div class="fl-top-right">
      <nav class="fl-nav" data-i18n-aria="nav.label" aria-label="Sezioni">
        <a href="progetti.html" data-i18n="nav.projects">Progetti</a>
        <a href="chi-sono.html" data-i18n="nav.about">Chi sono</a>
        <a href="contatti.html" aria-current="page" data-i18n="nav.contact">Contatti</a>
      </nav>
      <div class="lang" role="group" data-i18n-aria="lang.label" aria-label="Lingua">
        <button type="button" data-lang="it" aria-pressed="true">IT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- CONTATTI: titolo enorme e il modulo (i messaggi arrivano per email tramite Web3Forms) -->
    <section id="contatti" class="fl-section fl-page">
      <h1 class="fl-big" data-i18n="contact.big">Scriviamoci.</h1>
      <p class="fl-intro" data-i18n="contact.intro">Per un progetto, una collaborazione o anche solo per un saluto: ti rispondo appena posso.</p>
      <div class="fl-form">
      <form class="letter" id="contactForm" novalidate>
        <div class="letter-row">
          <label>
            <span data-i18n="contact.email">Email</span>
            <input name="email" type="email" autocomplete="email" required maxlength="200">
          </label>
          <label>
            <span data-i18n="contact.phone">Telefono <small>(facoltativo)</small></span>
            <input name="phone" type="tel" autocomplete="tel" maxlength="30">
          </label>
        </div>
        <label>
          <span data-i18n="contact.subject">Oggetto</span>
          <input name="subject" type="text" required maxlength="150">
        </label>
        <label>
          <span data-i18n="contact.message">Messaggio</span>
          <textarea name="message" rows="5" required maxlength="4000"></textarea>
        </label>
        <!-- trappola per i bot: le persone non la vedono -->
        <input class="botcheck" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="letter-foot">
          <button type="submit" class="send" data-i18n="contact.send">Invia</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </div>
      </form>
      </div>
    </section>
  </main>

  <footer class="fl-footer">
    <a href="index.html" data-i18n="footer.back">← Torna alla home</a>
